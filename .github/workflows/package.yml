name: Ubuntu packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: codex-desk-ubuntu
          path: |
            release/*.deb
            release/*.AppImage
