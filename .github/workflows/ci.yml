name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npx playwright test --config playwright.remote.config.ts
      - run: sudo apt-get update && sudo apt-get install -y gnome-terminal python3-gi gir1.2-gtk-3.0 openbox xvfb dbus-x11 x11-utils xauth libxtst6
      - run: npm run test:terminal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
  cli:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ['0.154.0', '0.158.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate the real CLI with an isolated local model fixture
        env:
          CLI_VERSION: ${{ matrix.version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" "@openai/codex@$CLI_VERSION" --no-audit --no-fund
          DESK_LIVE_BINARY="$RUNNER_TEMP/codex-cli/node_modules/.bin/codex" npm run test:steer
  android:
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: android/tailnet/go.mod
          cache-dependency-path: android/tailnet/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
      - run: go test -race -p=4 ./...
        working-directory: android/tailnet
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --no-daemon
        working-directory: android
      - run: npm ci && npm run build
      - name: Enable KVM for the isolated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Embedded engine and WebView integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -cores 2 -memory 3072
          disable-animations: true
          script: cd android/tailnet && DESK_ANDROID_EMBEDDED=1 ANDROID_SERIAL=emulator-5554 go test -p=4 -timeout=25m -run TestAndroidEmbeddedEndToEnd -v
      - uses: actions/upload-artifact@v4
        with:
          name: codex-desk-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
